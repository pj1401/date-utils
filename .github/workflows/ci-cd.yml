name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # --- Lint ---

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
            node-version-file: '.nvmrc'
            cache: 'npm'
      - name: npm clean install
        run: npm ci
      - run: node --run lint

  # --- Type Check ---

  check-types:
      # https://nodejs.org/learn/typescript/publishing-a-ts-package#what-to-do-with-your-types

      if: github.event_name == 'push' || github.event_name == 'pull_request'
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version-file: '.nvmrc'
            cache: 'npm'
        - name: npm clean install
          run: npm ci
        - run: node --run types:check

  # --- Unit tests ---

  unit-tests:
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version-file: '.nvmrc'
            cache: 'npm'
        - name: npm clean install
          run: npm ci
        - run: node --run test

  # --- Release ---

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release
        uses: softprops/action-gh-release@v3

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: npm i -g npm@11.21.0
      - run: npm ci

      - name: Stage publish to npm
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
